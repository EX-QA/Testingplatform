version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost/api/v1
    depends_on:
      - backend
    networks:
      - app-network
    # Frontend is served by Nginx, no exposed ports needed inside network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-testhub}:${DB_PASSWORD:-testhub123}@db:5432/${DB_NAME:-testhub}
      - DB_HOST=db
      - DB_USER=${DB_USER:-testhub}
      - DB_PASSWORD=${DB_PASSWORD:-testhub123}
      - DB_NAME=${DB_NAME:-testhub}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-testhub}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-testhub123}
      - POSTGRES_DB=${DB_NAME:-testhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-testhub} -d ${DB_NAME:-testhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
